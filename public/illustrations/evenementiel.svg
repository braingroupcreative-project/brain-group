<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration : couverture événementielle, appareil photo et caméra">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101B36"/><stop offset="1" stop-color="#1F3260"/></linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7A94F"/><stop offset="1" stop-color="#F28C28"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F28C28" stop-opacity=".55"/><stop offset="1" stop-color="#F28C28" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="800" height="600" rx="28" fill="url(#bg)"/>
  <!-- faisceaux de scène -->
  <g><path d="M140 0L60 420H260z" fill="url(#beam)"/><path d="M400 0L330 380H470z" fill="url(#beam)" opacity=".8"/><path d="M660 0L560 420H760z" fill="url(#beam)"/></g>
  <g fill="#fff"><rect x="120" y="-6" width="40" height="22" rx="6"/><rect x="380" y="-6" width="40" height="22" rx="6"/><rect x="640" y="-6" width="40" height="22" rx="6"/></g>
  <!-- foule -->
  <g fill="#0B1226"><circle cx="70" cy="560" r="34"/><circle cx="170" cy="575" r="38"/><circle cx="270" cy="565" r="32"/><circle cx="530" cy="570" r="36"/><circle cx="640" cy="562" r="38"/><circle cx="740" cy="572" r="34"/></g>
  <!-- appareil photo -->
  <g filter="url(#sh)">
    <rect x="190" y="230" width="330" height="210" rx="26" fill="#fff"/>
    <path d="M250 230l22-38h96l22 38z" fill="#E3E7F0"/>
    <rect x="212" y="252" width="62" height="30" rx="8" fill="#101B36"/>
    <circle cx="470" cy="262" r="12" fill="url(#og)"/>
    <circle cx="355" cy="340" r="86" fill="#101B36"/><circle cx="355" cy="340" r="68" fill="#1F3260"/><circle cx="355" cy="340" r="46" fill="#0B1226"/><circle cx="355" cy="340" r="24" fill="url(#og)" opacity=".9"/><ellipse cx="338" cy="322" rx="14" ry="8" fill="#fff" opacity=".6" transform="rotate(-30 338 322)"/>
    <rect x="190" y="396" width="330" height="44" rx="0" fill="#E3E7F0" opacity=".0"/>
  </g>
  <!-- caméra vidéo / cadre lecture -->
  <g filter="url(#sh)">
    <rect x="530" y="260" width="200" height="130" rx="16" fill="#fff"/>
    <rect x="544" y="274" width="172" height="102" rx="10" fill="#101B36"/>
    <circle cx="630" cy="325" r="26" fill="url(#og)"/><path d="M622 312l22 13-22 13z" fill="#fff"/>
    <rect x="544" y="392" width="172" height="8" rx="4" fill="#fff" opacity=".0"/>
    <rect x="552" y="362" width="120" height="5" rx="2.5" fill="#fff" opacity=".25"/><rect x="552" y="362" width="64" height="5" rx="2.5" fill="#F28C28"/>
  </g>
  <!-- confettis -->
  <g><rect x="90" y="120" width="14" height="6" rx="2" fill="#F28C28" transform="rotate(30 90 120)"/><rect x="310" y="110" width="12" height="6" rx="2" fill="#fff" transform="rotate(-20 310 110)"/><rect x="480" y="140" width="14" height="6" rx="2" fill="#F28C28" transform="rotate(50 480 140)"/><rect x="600" y="90" width="12" height="6" rx="2" fill="#fff" transform="rotate(10 600 90)"/><circle cx="220" cy="170" r="5" fill="#F28C28"/><circle cx="690" cy="180" r="5" fill="#fff"/><circle cx="130" cy="260" r="4" fill="#fff" opacity=".7"/><circle cx="760" cy="300" r="4" fill="#F28C28"/></g>
  <g fill="#F28C28"><path d="M600 460l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M120 470l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
</svg>
