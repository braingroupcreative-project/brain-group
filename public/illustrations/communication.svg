<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration : communication, réseaux sociaux, clip vidéo et visibilité en ligne">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16254A"/><stop offset="1" stop-color="#101B36"/></linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7A94F"/><stop offset="1" stop-color="#F28C28"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="800" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="680" cy="110" r="150" fill="#F28C28" opacity=".16"/><circle cx="100" cy="520" r="130" fill="#fff" opacity=".05"/>
  <g stroke="#fff" opacity=".06"><path d="M0 150H800M0 300H800M0 450H800M200 0V600M400 0V600M600 0V600"/></g>

  <!-- téléphone : fil de réseau social -->
  <g filter="url(#sh)">
    <rect x="285" y="60" width="230" height="470" rx="36" fill="#0B1226" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    <rect x="301" y="78" width="198" height="434" rx="26" fill="#fff"/>
    <rect x="370" y="86" width="60" height="9" rx="4.5" fill="#0B1226"/>
    <circle cx="326" cy="124" r="14" fill="url(#og)"/><rect x="348" y="115" width="70" height="8" rx="4" fill="#101B36"/><rect x="348" y="130" width="46" height="6" rx="3" fill="#C9D0DE"/>
    <rect x="315" y="152" width="170" height="150" rx="14" fill="#101B36"/>
    <circle cx="400" cy="227" r="30" fill="url(#og)"/><path d="M391 211l26 16-26 16z" fill="#fff"/>
    <rect x="327" y="284" width="146" height="5" rx="2.5" fill="#fff" opacity=".25"/><rect x="327" y="284" width="82" height="5" rx="2.5" fill="#F28C28"/>
    <path d="M330 326c0-6 8-10 12-4 4-6 12-2 12 4 0 8-12 16-12 16s-12-8-12-16z" fill="#F28C28"/>
    <rect x="370" y="324" width="24" height="8" rx="4" fill="#C9D0DE"/><rect x="404" y="324" width="24" height="8" rx="4" fill="#C9D0DE"/><rect x="438" y="324" width="24" height="8" rx="4" fill="#C9D0DE"/>
    <rect x="315" y="362" width="170" height="8" rx="4" fill="#101B36"/><rect x="315" y="380" width="130" height="8" rx="4" fill="#C9D0DE"/>
    <circle cx="326" cy="424" r="14" fill="#1F3260"/><rect x="348" y="415" width="70" height="8" rx="4" fill="#101B36"/><rect x="348" y="430" width="46" height="6" rx="3" fill="#C9D0DE"/>
    <rect x="315" y="452" width="170" height="44" rx="12" fill="#FEF3E7"/>
  </g>

  <!-- mégaphone -->
  <g filter="url(#sh)">
    <path d="M96 250l170-80v230L96 330z" fill="url(#og)"/>
    <rect x="62" y="248" width="48" height="84" rx="12" fill="#fff"/>
    <path d="M118 332l22 84a14 14 0 0 0 14 10h18a8 8 0 0 0 7-10l-20-72z" fill="#E3E7F0"/>
    <path d="M296 216a60 60 0 0 1 0 124M328 188a104 104 0 0 1 0 180" stroke="#F28C28" stroke-width="8" fill="none" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- clap de cinéma -->
  <g filter="url(#sh)" transform="rotate(8 620 390)">
    <rect x="548" y="350" width="150" height="110" rx="10" fill="#fff"/>
    <path d="M548 350h150v-30a8 8 0 0 0-8-8H556a8 8 0 0 0-8 8z" fill="#101B36"/>
    <g fill="#F28C28"><path d="M566 312l22 38h-24z"/><path d="M612 312l22 38h-24z"/><path d="M658 312l22 38h-24z"/></g>
    <rect x="566" y="378" width="70" height="8" rx="4" fill="#101B36"/><rect x="566" y="396" width="104" height="7" rx="3.5" fill="#C9D0DE"/><rect x="566" y="412" width="84" height="7" rx="3.5" fill="#C9D0DE"/><circle cx="670" cy="440" r="8" fill="#F28C28"/>
  </g>

  <!-- statistiques de visibilité -->
  <g filter="url(#sh)">
    <rect x="540" y="120" width="200" height="124" rx="16" fill="#fff"/>
    <rect x="558" y="138" width="70" height="8" rx="4" fill="#101B36"/><rect x="558" y="154" width="46" height="6" rx="3" fill="#C9D0DE"/>
    <g fill="#E3E7F0"><rect x="560" y="196" width="22" height="30" rx="4"/><rect x="592" y="184" width="22" height="42" rx="4"/><rect x="624" y="172" width="22" height="54" rx="4"/></g>
    <rect x="656" y="156" width="22" height="70" rx="4" fill="url(#og)"/>
    <path d="M690 190l10-14 10 8 14-22" stroke="#F28C28" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- notifications -->
  <g filter="url(#sh)">
    <rect x="70" y="440" width="190" height="52" rx="26" fill="#fff"/><circle cx="98" cy="466" r="14" fill="#F28C28"/><path d="M92 466l5 5 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="122" y="456" width="100" height="8" rx="4" fill="#101B36"/><rect x="122" y="472" width="64" height="6" rx="3" fill="#C9D0DE"/>
  </g>
  <g fill="#F28C28"><path d="M470 40l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M750 330l3.5 8.5 8.5 3.5-8.5 3.5-3.5 8.5-3.5-8.5-8.5-3.5 8.5-3.5z"/></g>
  <g fill="#fff" opacity=".6"><circle cx="60" cy="140" r="4"/><circle cx="240" cy="70" r="3"/><circle cx="760" cy="500" r="4"/></g>
</svg>
