    <rect x="186" y="200" width="150" height="14" rx="7" fill="#101B36"/><rect x="186" y="224" width="210" height="8" rx="4" fill="#C9D0DE"/><rect x="186" y="242" width="180" height="8" rx="4" fill="#C9D0DE"/>
    <rect x="186" y="274" width="96" height="30" rx="15" fill="url(#og)"/>
    <rect x="410" y="198" width="124" height="164" rx="12" fill="#FEF3E7"/><circle cx="472" cy="260" r="32" fill="#F28C28"/><rect x="430" y="310" width="84" height="8" rx="4" fill="#101B36"/><rect x="442" y="328" width="60" height="7" rx="3.5" fill="#101B36" opacity=".4"/>
